<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Tienda de Bicis</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>TIENDA DE BICIS</h1>
    </header>

    <nav id="menu">
        <ul>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="BICICLETAS.html">BICICLETAS</a></li>
            <li><a href="formulario.html">FORMULARIO</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulario </h2>
        <p>
         Si lo deseas rellena este formulario indicando que tipo de bicicleta queres

        </p>

        <form action="./submit_page" method="get">

            <p>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </p>

            <p>
                <label for="direccion">Direccion</label>
                <input type="text" id="direccion" name="direccion">
            </p>

            <p>
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono">
            </p>

            <p>
                <label for="nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento">
            </p>

            <p>
                Sexo
                <label><input type="radio" name="sexo" value="hombre"> Hombre</label>
                <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
            </p>

            <fieldset>
                <legend>Tipo de bicicleta</legend>
                <label><input type="checkbox" name="tipo" value="nueva"> Nueva</label>
                <label><input type="checkbox" name="tipo" value="usada"> Usada</label>
            </fieldset>

            <p>
                <label for="observaciones">Observaciones</label><br>
                <textarea id="observaciones" name="observaciones" rows="4" cols="40"></textarea>
            </p>

            <p>
                <button type="submit">Suscribeme</button>
            </p>

        </form>

        <p><a href="index.html">Volver a INICIO</a></p>
    </main>

</body>
</html>
